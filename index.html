<h1>Drive Connector</h1>
<p>Drive Connector is a private, single-user tool. It lets one person&rsquo;s own computer read from and save to a few Google Drive folders that have been explicitly shared with it, using <a href="https://rclone.org/">rclone</a>.</p>
<p>It is not a public service. Nobody else can sign up for or use it.</p>
